<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b132b;
      color: #f8fafc;
      margin: 0;
      padding: 1rem;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #2b3a67;
      padding-bottom: 0.75rem;
    }
    .title { font-weight: 800; font-size: 1.1rem; color: #4cc9f0; }
    .input-group { margin-bottom: 1rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.6rem;
      background: #1c2541;
      border: 1px solid #2b3a67;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      background: #4cc9f0;
      color: #0b132b;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #4895ef; }
    #result {
      margin-top: 1rem;
      font-size: 0.85rem;
      display: none;
      padding: 0.75rem;
      border-radius: 6px;
      background: #171f38;
      border: 1px solid #2b3a67;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">ThreatGuard AI Shield</span>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Enter URL to test...">
  </div>
  <button id="scanBtn">Inspect Link Safety</button>

  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
